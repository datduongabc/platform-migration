gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

server {
    listen 80;
    server_name localhost;

    # Requests carry credentials (cookies) to the backend and uploaded audio/video
    # can be up to the backend's own 1 GiB limit — match it here with headroom so
    # nginx never rejects a large upload before it reaches the backend.
    client_max_body_size 1100m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reverse-proxy API calls to the backend container on the internal compose
    # network. The frontend bundle is built once with a relative /api/v1 root
    # (see app.config.ts) and never hardcodes a backend host, so this proxy is
    # what actually resolves it — the same image works behind any domain.
    # ^~ stops nginx from also checking the regex .js/.css cache-header location
    # below for these prefixes — API/upload paths must always hit the proxy.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads over slow connections need more than nginx's 60s default.
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploaded audio/video/avatars served by the backend's StaticFiles mount.
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed JS/CSS (main-<hash>.js) never change contents under a given
    # filename, so they're safe to cache aggressively and immutably.
    location ~* \.(?:js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (the app shell) must always be revalidated, otherwise browsers
    # can pin an old shell that references JS/CSS chunks from a previous deploy
    # that no longer exist on disk.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
